title: M Viswanath Sai
description: >-
  Essays, research notes and projects by M Viswanath Sai (Viswa), engineer and
  founder in San Francisco.
url: https://mviswanathsai.com
baseurl: ""
timezone: Asia/Kolkata
permalink: /essays/:title/

lang: en

author:
  name: M Viswanath Sai

kramdown:
  hard_wrap: true

plugins:
  - jekyll-titles-from-headings
  - jekyll-seo-tag
  - jekyll-sitemap

titles_from_headings:
  collections: true
  strip_title: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: essay
      author: M Viswanath Sai

exclude:
  - README.md
  - obsidian-plugin

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf9f6">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <div class="page">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="wordmark" href="{{ '/' | relative_url }}">Viswa<span class="dot">.</span></a>
        <a href="{{ '/' | relative_url }}">Essays</a>
      </nav>
      <main id="content">{{ content }}</main>
      <footer>Viswanath Sai Muthu <span aria-hidden="true">·</span> {{ site.time | date: '%Y' }}</footer>
    </div>
    <script>
      const fonts = ['"Fraunces", Georgia, serif', '"DM Sans", Arial, sans-serif', 'Georgia, serif'];
      document.querySelectorAll('h1, h2, h3').forEach(heading => {
        heading.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];
      });
    </script>
  </body>
</html>

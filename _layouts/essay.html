---
layout: default
---

<article>
  <header class="essay-header">
    <a class="back" href="{{ '/' | relative_url }}">← All essays</a>
    <h1>{{ page.title | escape }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y · %-I:%M %p %Z' }}</time>
  </header>
  <div class="prose">{{ content }}</div>
  <a class="back end-link" href="{{ '/' | relative_url }}">← All essays</a>
</article>
